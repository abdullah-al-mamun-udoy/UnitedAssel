<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>United Aseel Construction Ltd.</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Splash Screen */
        #splash-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2d3436;
            color: white;
            height: 100vh;
            width: 100vw;
            font-size: 3rem;
            position: fixed;
            /* stay on top */
            top: 0;
            left: 0;
            z-index: 1000;
        }

        /* Hide main content initially */
        #main-content {
            display: none;
        }

        /* Header/Nav */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #0984e3;
            color: white;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Main page content */
        .content {
            padding: 40px;
            text-align: center;
        }

        .content h2 {
            color: #2d3436;
        }

        .content p {
            color: #636e72;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        United Aseel Construction Ltd.
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <header>
            <div class="logo">United Aseel Construction Ltd.</div>
            <nav>
              <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Vision</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">About Us</a></li>
              </ul>
            </nav>
          </header>
          

        <section class="content">
            <h2>Welcome to United Aseel Construction Ltd.</h2>
            <p>Your trusted partner in construction excellence.</p>
        </section>
    </div>

    <script>
        // Wait 3 seconds, then hide splash and show main content
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("splash-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 3000);
        });
    </script>

</body>

</html>
